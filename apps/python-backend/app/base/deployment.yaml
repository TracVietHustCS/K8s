apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-backend
  namespace: backend
  labels:
    app.kubernetes.io/name: python-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-backend
    spec:
      containers:
        - name: backend
          image: python-backend:placeholder # Tên image mẫu
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /db-check # Sửa thành route thực tế đang chạy
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /db-check # Sửa thành route thực tế đang chạy
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
