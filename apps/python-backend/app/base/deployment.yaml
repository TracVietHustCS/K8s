apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-backend
  namespace: backend
  labels:
    app.kubernetes.io/name: python-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-backend
    spec:
      containers:
        - name: backend
          image: viet2212/pythonbacken:1.0
          ports:
            - containerPort: 8000
          readinessProbe: # Kiểm tra App đã sẵn sàng nhận khách chưa
            httpGet:
              path: /health # Giả sử app có endpoint này
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: # Kiểm tra App còn sống không (nếu treo thì restart)
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
