apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dify
  namespace: dify
spec:
  interval: 5m
  chart:
    spec:
      chart: dify
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: dify
        namespace: dify
  values:
    api:
      replicaCount: 2
    worker:
      replicaCount: 2
    web:
      replicaCount: 2

    vectorDatabase: pgvector

    externalPgvector:
      enabled: true
      host: dify-db-rw.dify.svc.cluster.local
      port: 5432
      user: dify
      password: ""
      database: dify
      existingSecret: dify-common-secret
      existingSecretPasswordKey: DB_PASSWORD

    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: true
        existingSecret: dify-common-secret
        existingSecretPasswordKey: REDIS_PASSWORD

    minio:
      enabled: true
      auth:
        existingSecret: dify-common-secret
        rootUserKey: MINIO_ROOT_USER
        rootPasswordKey: MINIO_ROOT_PASSWORD
      persistence:
        size: 2Gi

    postgresql:
      enabled: false 

    externalPostgres:
      enabled: true
      address: dify-db-rw.dify.svc.cluster.local
      port: 5432
      username: dify
      password: ""
      database:
        api: dify
      existingSecret: dify-common-secret 
      existingSecretPasswordKey: DB_PASSWORD

    ingress:
      enabled: false
