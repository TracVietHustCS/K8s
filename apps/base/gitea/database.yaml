apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-db
spec:
  instances: 2 # High Availability for Prod
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  storage:
    size: 2Gi
    storageClass: local-path

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-db-secret

  # For production, we'd add backup to S3/MinIO here as per GEMINI.md
  # backup:
  #   retentionPolicy: "30d"
  #   barmanObjectStore:
  #     destinationPath: "s3://backups/gitea"
  #     endpointURL: "http://minio-service.infrastructure.svc:9000"
  #     s3Credentials:
  #       accessKeyId:
  #         name: minio-creds
  #         key: accessKey
  #       secretAccessKey:
  #         name: minio-creds
  #         key: secretKey
