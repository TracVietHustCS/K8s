apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-frontend
  labels:
    app.kubernetes.io/name: nextjs-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextjs-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextjs-frontend
    spec:
      containers:
        - name: frontend
          image: nextjs-frontend:latest # Placeholder
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-frontend
  labels:
    app.kubernetes.io/name: nextjs-frontend
spec:
  selector:
    app.kubernetes.io/name: nextjs-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextjs-frontend
  labels:
    app.kubernetes.io/name: nextjs-frontend
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`example.com`) # Placeholder
      kind: Rule
      services:
        - name: nextjs-frontend
          port: 80
