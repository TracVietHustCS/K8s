apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-strip-prefix
  namespace: vault
spec:
  stripPrefix:
    prefixes:
      - /vault
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-ui
  namespace: vault
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/vault`) || PathPrefix(`/ui`) || PathPrefix(`/v1`)
      kind: Rule
      middlewares:
        - name: vault-strip-prefix
      services:
        - name: vault
          port: 8200
