apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gitea-strip-prefix
  namespace: gitea
spec:
  stripPrefix:
    prefixes:
      - /gitea
---
apiVersion: traefik.io/v1alpha1
kind:   
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix("/gitea")
      kind: Rule
      middlewares:
        - name: gitea-strip-prefix
      services:
        - name: gitea
          port: 3000
    - match: PathPrefix("/login") || PathPrefix("/user") || PathPrefix("/api") || PathPrefix("/oauth2")
      kind: Rule
      services:
        - name: gitea
          port: 3000
