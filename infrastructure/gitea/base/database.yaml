apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-db
spec:
  instances: 2 # High Availability for Prod
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  storage:
    size: 2Gi
    storageClass: local-path

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-db-secret
